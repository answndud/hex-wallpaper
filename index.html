<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Wallpaper</title>
    <meta name="description" content="HEX 색상 코드로 단색 또는 그라데이션 PNG 배경화면을 생성합니다.">
    <style>
        :root {
            --bg: #101214;
            --panel: #181d21;
            --panel-strong: #20272c;
            --text: #edf2f4;
            --muted: #9aa7ad;
            --line: #303940;
            --accent: #29a37a;
            --accent-strong: #38c090;
            --warning: #f6c453;
            --error: #ff6b6b;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
            --preview-bg: #15191d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
        }

        .app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 448px;
            min-height: 100vh;
        }

        .preview-panel {
            min-width: 0;
            padding: 24px;
        }

        .preview-surface {
            position: sticky;
            top: 24px;
            min-height: calc(100vh - 48px);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            background:
                linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                var(--preview-bg);
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-size: 24px 24px;
            box-shadow: var(--shadow);
            transition: background 180ms ease;
        }

        .preview-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(10, 12, 14, 0.58);
            backdrop-filter: blur(14px);
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: conic-gradient(from 180deg, #29a37a, #f6c453, #6ea8fe, #29a37a);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
            flex: 0 0 auto;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: 22px;
            line-height: 1.1;
            font-weight: 760;
            letter-spacing: 0;
        }

        .preview-label {
            margin-top: 4px;
            color: rgba(237, 242, 244, 0.74);
            font-size: 13px;
            line-height: 1.4;
        }

        .preview-spec {
            align-self: flex-end;
            max-width: 100%;
            padding: 9px 11px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(10, 12, 14, 0.58);
            color: rgba(237, 242, 244, 0.82);
            font-size: 13px;
            line-height: 1.3;
            backdrop-filter: blur(14px);
        }

        .controls {
            min-height: 100vh;
            border-left: 1px solid var(--line);
            background: var(--panel);
            padding: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h2 {
            font-size: 20px;
            line-height: 1.2;
            font-weight: 720;
            letter-spacing: 0;
        }

        fieldset {
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }

        legend,
        label.label {
            display: block;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
            line-height: 1.3;
        }

        .segmented {
            display: grid;
            gap: 8px;
        }

        .segmented.columns-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .segmented.columns-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .segmented input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .segment {
            display: grid;
            place-items: center;
            min-height: 42px;
            padding: 9px 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-strong);
            color: var(--text);
            font-size: 14px;
            font-weight: 680;
            line-height: 1.1;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
        }

        .segmented input:focus-visible + .segment,
        .color-swatch:focus-visible,
        .active-swatch:focus-visible,
        .copy-button:focus-visible,
        .sv-area:focus-visible,
        .hue-slider:focus-visible,
        .eyedropper-button:focus-visible,
        .field-input:focus-visible,
        .select-wrap select:focus-visible,
        .ghost-button:focus-visible,
        .download-button:focus-visible {
            outline: 2px solid var(--warning);
            outline-offset: 2px;
        }

        .segmented input:checked + .segment {
            border-color: rgba(41, 163, 122, 0.78);
            background: rgba(41, 163, 122, 0.16);
            color: #c9f9e7;
        }

        .color-stack {
            display: grid;
            gap: 10px;
        }

        .color-row {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }

        .color-row[hidden],
        .gradient-controls[hidden] {
            display: none;
        }

        .color-swatch,
        .active-swatch {
            width: 44px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0;
            cursor: pointer;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.18);
            transition: transform 160ms ease, border-color 160ms ease;
        }

        .color-swatch:hover,
        .active-swatch:hover {
            transform: translateY(-1px);
            border-color: #56636c;
        }

        .color-row.active .color-swatch {
            border-color: var(--warning);
        }

        .color-editor {
            display: grid;
            gap: 12px;
            margin-top: 14px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #121619;
        }

        .active-color-head {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
        }

        .metric-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .metric {
            min-width: 0;
        }

        .metric-label {
            display: block;
            margin-bottom: 3px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 720;
        }

        .metric-value {
            display: block;
            min-width: 0;
            overflow: hidden;
            color: var(--text);
            font-size: 13px;
            font-weight: 760;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tone-strip {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            height: 30px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .tone-chip {
            min-width: 0;
        }

        .sv-area {
            position: relative;
            height: 214px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
        }

        .sv-handle {
            position: absolute;
            width: 18px;
            height: 18px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.42), 0 4px 12px rgba(0, 0, 0, 0.35);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .hue-slider {
            width: 100%;
            height: 16px;
            margin: 0;
            border-radius: 999px;
            appearance: none;
            background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
            cursor: pointer;
        }

        .hue-slider::-webkit-slider-thumb {
            width: 22px;
            height: 22px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            appearance: none;
            background: currentColor;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3), 0 3px 10px rgba(0, 0, 0, 0.38);
        }

        .hue-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3), 0 3px 10px rgba(0, 0, 0, 0.38);
        }

        .editor-input-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 44px 44px;
            gap: 10px;
        }

        .eyedropper-button,
        .copy-button {
            display: grid;
            place-items: center;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-strong);
            color: var(--text);
            cursor: pointer;
        }

        .eyedropper-button:disabled,
        .copy-button:disabled {
            cursor: not-allowed;
            opacity: 0.48;
        }

        .eyedropper-button svg,
        .copy-button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .harmony-controls[hidden] {
            display: none;
        }

        .field-input,
        .select-wrap select {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #121619;
            color: var(--text);
        }

        .field-input {
            padding: 0 12px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 15px;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .field-input::placeholder {
            color: #647178;
        }

        .color-row.invalid .field-input {
            border-color: rgba(255, 107, 107, 0.74);
        }

        .field-input.invalid {
            border-color: rgba(255, 107, 107, 0.74);
        }

        .range-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 58px;
            gap: 12px;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .angle-value {
            min-height: 32px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #121619;
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap select {
            appearance: none;
            padding: 0 40px 0 12px;
            cursor: pointer;
        }

        .select-wrap::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: translateY(-65%) rotate(45deg);
            pointer-events: none;
        }

        .actions {
            display: grid;
            gap: 10px;
        }

        .ghost-button,
        .download-button {
            min-height: 44px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
        }

        .ghost-button {
            padding: 0 12px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .ghost-button:hover {
            color: var(--text);
            border-color: #48545c;
        }

        .download-button {
            width: 100%;
            background: var(--accent);
            color: #07110d;
            font-size: 15px;
            font-weight: 800;
        }

        .download-button:hover:not(:disabled) {
            transform: translateY(-1px);
            background: var(--accent-strong);
        }

        .download-button:disabled {
            cursor: not-allowed;
            opacity: 0.54;
        }

        .status {
            min-height: 38px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #121619;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.35;
        }

        .status.error {
            border-color: rgba(255, 107, 107, 0.6);
            color: #ffb3b3;
        }

        .status.success {
            border-color: rgba(41, 163, 122, 0.62);
            color: #bdf4dd;
        }

        @media (max-width: 880px) {
            .app {
                grid-template-columns: 1fr;
            }

            .preview-panel {
                padding: 14px;
            }

            .preview-surface {
                position: relative;
                top: auto;
                min-height: 54vh;
            }

            .controls {
                min-height: auto;
                border-left: 0;
                border-top: 1px solid var(--line);
                padding: 18px 14px 24px;
            }
        }

        @media (max-width: 520px) {
            .preview-overlay {
                padding: 14px;
            }

            .brand {
                width: 100%;
            }

            .preview-spec {
                align-self: stretch;
                text-align: center;
            }

            .segmented.columns-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <!-- Minimal sharp visual system -->
    <style id="minimal-sharp-theme">
        :root, [data-theme="light"], [data-theme="dark"] {
            --bg-primary: #ffffff;
            --bg-secondary: #ffffff;
            --bg-tertiary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #ffffff;
            --bg-input: #ffffff;
            --bg: #ffffff;
            --panel: #ffffff;
            --panel-strong: #ffffff;
            --preview-bg: #ffffff;
            --accent: #D2E0E5;
            --accent-primary: #D2E0E5;
            --accent-secondary: #D2E0E5;
            --accent-light: #D2E0E5;
            --accent-strong: #D2E0E5;
            --accent-dim: #D2E0E5;
            --primary: #D2E0E5;
            --primary-color: #D2E0E5;
            --gradient-accent: none;
            --gradient-1: none;
            --gradient-2: none;
            --gradient-3: none;
        }

        html, body {
            background: #ffffff !important;
        }

        *, *::before, *::after {
            border-radius: 0 !important;
        }

        button, .button, .btn, .action-btn, .primary,
        input[type="submit"], input[type="button"] {
            background: #D2E0E5 !important;
            background-image: none !important;
            color: #101416 !important;
            border-color: #D2E0E5 !important;
            box-shadow: none !important;
        }

        button:hover, .button:hover, .btn:hover, .action-btn:hover,
        input[type="submit"]:hover, input[type="button"]:hover {
            background: #D2E0E5 !important;
            border-color: #101416 !important;
        }
    </style>
    <!-- Rational project palette -->
    <style id="rational-project-palette">
        :root, [data-theme="light"], [data-theme="dark"] {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F3F7F6;
            --bg-tertiary: #F3F7F6;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F3F7F6;
            --bg-input: #EEF4F3;
            --bg: #FFFFFF;
            --panel: #FFFFFF;
            --panel-strong: #F3F7F6;
            --preview-bg: #F3F7F6;
            --text-primary: #1C2929;
            --text-secondary: #627574;
            --text-muted: #627574;
            --border: #D5E1DF;
            --border-color: #D5E1DF;
            --border-hover: #4F8983;
            --accent: #4F8983;
            --accent-primary: #4F8983;
            --accent-secondary: #356E69;
            --accent-light: #F3F7F6;
            --accent-strong: #356E69;
            --accent-dim: #F3F7F6;
            --primary: #4F8983;
            --primary-color: #4F8983;
            --success: #477B59;
            --warning: #A77A35;
            --danger: #A85B5B;
            --error: #A85B5B;
            --gradient-accent: none;
            --gradient-1: none;
            --gradient-2: none;
            --gradient-3: none;
        }

        html, body {
            background: #FFFFFF !important;
            color: #1C2929 !important;
        }

        button, .button, .btn, .action-btn, .primary,
        input[type="submit"], input[type="button"] {
            background: var(--accent) !important;
            background-image: none !important;
            color: #1C2929 !important;
            border-color: var(--accent) !important;
            box-shadow: none !important;
        }

        button:hover, .button:hover, .btn:hover, .action-btn:hover,
        input[type="submit"]:hover, input[type="button"]:hover {
            background: var(--accent-strong) !important;
            border-color: var(--accent-strong) !important;
            color: #FFFFFF !important;
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="preview-panel" aria-label="배경화면 미리보기">
            <div class="preview-surface" id="previewSurface">
                <div class="preview-overlay">
                    <div class="brand">
                        <span class="brand-mark" aria-hidden="true"></span>
                        <div>
                            <h1>Hex Wallpaper</h1>
                            <p class="preview-label" id="previewLabel">HEX 입력 대기</p>
                        </div>
                    </div>
                    <p class="preview-spec" id="previewSpec">1920 x 1080 · 1 MB · PNG</p>
                </div>
            </div>
        </section>

        <aside class="controls" aria-label="배경화면 설정">
            <form id="wallpaperForm" autocomplete="off">
                <div class="section-head">
                    <h2>설정</h2>
                    <button class="ghost-button" type="reset">초기화</button>
                </div>

                <fieldset>
                    <legend>모드</legend>
                    <div class="segmented columns-3">
                        <label>
                            <input type="radio" name="mode" value="solid" checked>
                            <span class="segment">단색</span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="gradient2">
                            <span class="segment">2색</span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="gradient3">
                            <span class="segment">3색</span>
                        </label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>색상</legend>
                    <div class="color-stack">
                        <div class="color-row" data-color-row="0">
                            <button class="color-swatch" type="button" aria-label="첫 번째 색상 편집"></button>
                            <input class="field-input" type="text" inputmode="text" maxlength="7" value="#2A9D8F" placeholder="#2A9D8F" aria-label="첫 번째 HEX 코드">
                        </div>
                        <div class="color-row" data-color-row="1" hidden>
                            <button class="color-swatch" type="button" aria-label="두 번째 색상 편집"></button>
                            <input class="field-input" type="text" inputmode="text" maxlength="7" value="#F6C453" placeholder="#F6C453" aria-label="두 번째 HEX 코드">
                        </div>
                        <div class="color-row" data-color-row="2" hidden>
                            <button class="color-swatch" type="button" aria-label="세 번째 색상 편집"></button>
                            <input class="field-input" type="text" inputmode="text" maxlength="7" value="#6EA8FE" placeholder="#6EA8FE" aria-label="세 번째 HEX 코드">
                        </div>
                    </div>

                    <div class="color-editor" id="colorEditor">
                        <div class="active-color-head">
                            <button class="active-swatch" id="activeSwatch" type="button" aria-label="현재 색상"></button>
                            <div class="metric-strip" aria-live="polite">
                                <span class="metric">
                                    <span class="metric-label">Hex</span>
                                    <strong class="metric-value" id="hexMetric">#2A9D8F</strong>
                                </span>
                                <span class="metric">
                                    <span class="metric-label">RGB</span>
                                    <strong class="metric-value" id="rgbMetric">42, 157, 143</strong>
                                </span>
                                <span class="metric">
                                    <span class="metric-label">HSL</span>
                                    <strong class="metric-value" id="hslMetric">173, 58, 39</strong>
                                </span>
                            </div>
                        </div>
                        <div class="tone-strip" id="toneStrip" aria-hidden="true"></div>
                        <div class="sv-area" id="svArea" role="slider" tabindex="0" aria-label="채도와 명도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58">
                            <span class="sv-handle" id="svHandle"></span>
                        </div>
                        <input class="hue-slider" id="hueInput" type="range" min="0" max="360" value="173" aria-label="색상">
                        <div class="editor-input-row">
                            <input class="field-input" id="activeHexInput" type="text" inputmode="text" maxlength="7" value="#2A9D8F" aria-label="현재 HEX 코드">
                            <button class="eyedropper-button" id="eyedropperButton" type="button" aria-label="스포이드로 색상 선택">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="m2 22 5-1 10.5-10.5"></path>
                                    <path d="m14 4 6 6"></path>
                                    <path d="m15 3 6 6-2 2-6-6z"></path>
                                    <path d="m7 21-4-4"></path>
                                </svg>
                            </button>
                            <button class="copy-button" id="copyHexButton" type="button" aria-label="현재 HEX 복사">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="harmony-controls" id="harmonyControls" hidden>
                    <label class="label" for="harmonySelect">팔레트</label>
                    <div class="select-wrap">
                        <select id="harmonySelect">
                            <option value="analogous" selected>유사색</option>
                            <option value="complementary">보색</option>
                            <option value="triadic">삼각 조화</option>
                            <option value="monochrome">명도 변화</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset class="gradient-controls" id="gradientControls" hidden>
                    <legend>각도</legend>
                    <div class="range-row">
                        <input id="angleInput" type="range" min="0" max="360" step="15" value="135" aria-label="그라데이션 각도">
                        <output class="angle-value" id="angleValue" for="angleInput">135°</output>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>파일 크기</legend>
                    <div class="segmented columns-3">
                        <label>
                            <input type="radio" name="fileSize" value="1" checked>
                            <span class="segment">1 MB</span>
                        </label>
                        <label>
                            <input type="radio" name="fileSize" value="2">
                            <span class="segment">2 MB</span>
                        </label>
                        <label>
                            <input type="radio" name="fileSize" value="3">
                            <span class="segment">3 MB</span>
                        </label>
                    </div>
                </fieldset>

                <fieldset>
                    <label class="label" for="resolutionSelect">해상도</label>
                    <div class="select-wrap">
                        <select id="resolutionSelect">
                            <option value="1920x1080" selected>1920 x 1080</option>
                            <option value="2560x1440">2560 x 1440</option>
                            <option value="3840x2160">3840 x 2160</option>
                            <option value="1080x1920">1080 x 1920</option>
                            <option value="1600x1600">1600 x 1600</option>
                        </select>
                    </div>
                </fieldset>

                <div class="actions">
                    <button class="download-button" id="downloadButton" type="submit" disabled>다운로드</button>
                    <p class="status" id="status" aria-live="polite">HEX 입력 대기</p>
                </div>
            </form>
        </aside>
    </main>

    <script>
        const TARGET_BYTES = {
            1: 1000000,
            2: 2000000,
            3: 3000000
        };

        const MODE_STOPS = {
            solid: 1,
            gradient2: 2,
            gradient3: 3
        };

        const DEFAULT_COLORS = ["#2A9D8F", "#F6C453", "#6EA8FE"];

        const form = document.getElementById("wallpaperForm");
        const previewSurface = document.getElementById("previewSurface");
        const previewLabel = document.getElementById("previewLabel");
        const previewSpec = document.getElementById("previewSpec");
        const harmonyControls = document.getElementById("harmonyControls");
        const harmonySelect = document.getElementById("harmonySelect");
        const gradientControls = document.getElementById("gradientControls");
        const angleInput = document.getElementById("angleInput");
        const angleValue = document.getElementById("angleValue");
        const resolutionSelect = document.getElementById("resolutionSelect");
        const downloadButton = document.getElementById("downloadButton");
        const statusEl = document.getElementById("status");
        const activeSwatch = document.getElementById("activeSwatch");
        const activeHexInput = document.getElementById("activeHexInput");
        const eyedropperButton = document.getElementById("eyedropperButton");
        const copyHexButton = document.getElementById("copyHexButton");
        const hexMetric = document.getElementById("hexMetric");
        const rgbMetric = document.getElementById("rgbMetric");
        const hslMetric = document.getElementById("hslMetric");
        const toneStrip = document.getElementById("toneStrip");
        const svArea = document.getElementById("svArea");
        const svHandle = document.getElementById("svHandle");
        const hueInput = document.getElementById("hueInput");
        const rows = Array.from(document.querySelectorAll("[data-color-row]")).map((row) => ({
            row,
            swatch: row.querySelector(".color-swatch"),
            text: row.querySelector(".field-input")
        }));

        let activeColorIndex = 0;
        let activeHsv = hexToHsv(DEFAULT_COLORS[0]);
        let isPointerEditing = false;

        rows.forEach(({ row, swatch, text }, index) => {
            swatch.addEventListener("click", () => {
                setActiveColorIndex(index);
            });

            text.addEventListener("focus", () => {
                setActiveColorIndex(index);
            });

            text.addEventListener("input", () => {
                const normalized = normalizeHex(text.value);
                row.classList.toggle("invalid", text.value.trim().length > 0 && !normalized);
                if (normalized) {
                    applyRowColor(index, normalized, { syncEditor: index === activeColorIndex });
                }
                updateApp();
            });

            text.addEventListener("blur", () => {
                const normalized = normalizeHex(text.value);
                if (normalized) {
                    applyRowColor(index, normalized, { syncEditor: index === activeColorIndex });
                }
                updateApp();
            });
        });

        Array.from(form.elements.mode).forEach((input) => {
            input.addEventListener("change", () => {
                const mode = getMode();
                if (MODE_STOPS[mode] > 1) {
                    seedRelatedPalette(mode);
                }
                if (activeColorIndex >= MODE_STOPS[mode]) {
                    setActiveColorIndex(0);
                }
                updateApp();
            });
        });

        harmonySelect.addEventListener("change", () => {
            const mode = getMode();
            if (MODE_STOPS[mode] > 1) {
                seedRelatedPalette(mode);
            }
            updateApp();
        });

        form.addEventListener("change", (event) => {
            if (event.target.name !== "mode" && event.target !== harmonySelect) {
                updateApp();
            }
        });

        form.addEventListener("reset", () => {
            window.setTimeout(() => {
                DEFAULT_COLORS.forEach((color, index) => applyRowColor(index, color, { syncEditor: index === activeColorIndex }));
                rows.forEach(({ row }) => row.classList.remove("invalid"));
                setActiveColorIndex(0);
                updateApp();
            }, 0);
        });

        angleInput.addEventListener("input", updateApp);
        hueInput.addEventListener("input", () => {
            activeHsv.h = Number(hueInput.value);
            commitActiveHsv();
        });

        activeHexInput.addEventListener("input", () => {
            const normalized = normalizeHex(activeHexInput.value);
            activeHexInput.classList.toggle("invalid", activeHexInput.value.trim().length > 0 && !normalized);
            if (normalized) {
                applyRowColor(activeColorIndex, normalized, { syncEditor: true });
                updateApp();
            }
        });

        activeHexInput.addEventListener("blur", () => {
            const normalized = normalizeHex(activeHexInput.value);
            if (normalized) {
                applyRowColor(activeColorIndex, normalized, { syncEditor: true });
            }
            updateApp();
        });

        if ("EyeDropper" in window) {
            eyedropperButton.addEventListener("click", async () => {
                try {
                    const result = await new EyeDropper().open();
                    applyRowColor(activeColorIndex, result.sRGBHex, { syncEditor: true });
                    updateApp();
                } catch (error) {
                    setStatus("스포이드 취소", "");
                }
            });
        } else {
            eyedropperButton.disabled = true;
        }

        copyHexButton.addEventListener("click", async () => {
            const color = getColorAt(activeColorIndex);
            if (!color || !navigator.clipboard) {
                return;
            }
            await navigator.clipboard.writeText(color);
            setStatus(`${color} 복사`, "success");
        });

        svArea.addEventListener("pointerdown", (event) => {
            isPointerEditing = true;
            svArea.setPointerCapture(event.pointerId);
            setSvFromPointer(event);
        });

        svArea.addEventListener("pointermove", (event) => {
            if (isPointerEditing) {
                setSvFromPointer(event);
            }
        });

        svArea.addEventListener("pointerup", (event) => {
            isPointerEditing = false;
            svArea.releasePointerCapture(event.pointerId);
        });

        svArea.addEventListener("keydown", (event) => {
            const step = event.shiftKey ? 10 : 2;
            if (event.key === "ArrowLeft") {
                activeHsv.s = clamp(activeHsv.s - step, 0, 100);
            } else if (event.key === "ArrowRight") {
                activeHsv.s = clamp(activeHsv.s + step, 0, 100);
            } else if (event.key === "ArrowUp") {
                activeHsv.v = clamp(activeHsv.v + step, 0, 100);
            } else if (event.key === "ArrowDown") {
                activeHsv.v = clamp(activeHsv.v - step, 0, 100);
            } else {
                return;
            }
            event.preventDefault();
            commitActiveHsv();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            await downloadWallpaper();
        });

        DEFAULT_COLORS.forEach((color, index) => applyRowColor(index, color, { syncEditor: index === activeColorIndex }));
        setActiveColorIndex(0);
        updateApp();

        function updateApp() {
            const mode = getMode();
            const stopCount = MODE_STOPS[mode];
            const colors = collectColors();
            const sizeMb = getSelectedSize();
            const [width, height] = parseResolution(resolutionSelect.value);
            const angle = Number(angleInput.value);

            rows.forEach(({ row }, index) => {
                row.hidden = index >= stopCount;
            });

            harmonyControls.hidden = mode === "solid";
            gradientControls.hidden = mode === "solid";
            angleValue.value = `${angle}°`;
            angleValue.textContent = `${angle}°`;
            previewSpec.textContent = `${width} x ${height} · ${sizeMb} MB · PNG`;
            syncEditorFromActive();

            if (colors) {
                const background = makeCssBackground(mode, colors, angle);
                previewSurface.style.background = background;
                previewLabel.textContent = colors.join(" · ");
                setStatus("다운로드 준비 완료", "success");
                downloadButton.disabled = false;
            } else {
                previewSurface.style.background = "";
                previewLabel.textContent = "HEX 입력 대기";
                setStatus(getMissingMessage(mode), "error");
                downloadButton.disabled = true;
            }
        }

        function getMode() {
            return form.elements.mode.value;
        }

        function getSelectedSize() {
            return Number(form.elements.fileSize.value);
        }

        function getColorAt(index) {
            return normalizeHex(rows[index].text.value);
        }

        function setActiveColorIndex(index) {
            activeColorIndex = clamp(index, 0, rows.length - 1);
            rows.forEach(({ row }, rowIndex) => {
                row.classList.toggle("active", rowIndex === activeColorIndex);
            });
            syncEditorFromActive();
        }

        function applyRowColor(index, hex, options = {}) {
            const normalized = normalizeHex(hex);
            if (!normalized) {
                return;
            }

            rows[index].text.value = normalized;
            rows[index].swatch.style.background = normalized;
            rows[index].row.classList.remove("invalid");

            if (options.syncEditor) {
                activeHsv = hexToHsv(normalized);
                syncEditorFromActive();
            }
        }

        function seedRelatedPalette(mode) {
            const base = getColorAt(0) || DEFAULT_COLORS[0];
            const palette = makeRelatedPalette(base, MODE_STOPS[mode], harmonySelect.value);
            palette.forEach((color, index) => {
                applyRowColor(index, color, { syncEditor: index === activeColorIndex });
            });
        }

        function makeRelatedPalette(baseHex, count, harmony) {
            const baseRgb = hexToRgb(baseHex);
            const baseHsl = rgbToHsl(baseRgb.r, baseRgb.g, baseRgb.b);

            if (harmony === "complementary") {
                return count === 2
                    ? [baseHex, hslToHex(rotateHue(baseHsl.h, 180), baseHsl.s, baseHsl.l)]
                    : [
                        baseHex,
                        hslToHex(rotateHue(baseHsl.h, 180), baseHsl.s, baseHsl.l),
                        hslToHex(rotateHue(baseHsl.h, 198), clamp(baseHsl.s - 6, 12, 100), clamp(baseHsl.l + 8, 8, 92))
                    ];
            }

            if (harmony === "triadic") {
                return count === 2
                    ? [baseHex, hslToHex(rotateHue(baseHsl.h, 120), baseHsl.s, baseHsl.l)]
                    : [
                        baseHex,
                        hslToHex(rotateHue(baseHsl.h, 120), baseHsl.s, baseHsl.l),
                        hslToHex(rotateHue(baseHsl.h, 240), baseHsl.s, baseHsl.l)
                    ];
            }

            if (harmony === "monochrome") {
                return count === 2
                    ? [
                        baseHex,
                        hslToHex(baseHsl.h, clamp(baseHsl.s + 4, 12, 100), clamp(baseHsl.l - 12, 8, 92))
                    ]
                    : [
                        baseHex,
                        hslToHex(baseHsl.h, clamp(baseHsl.s - 14, 12, 100), clamp(baseHsl.l + 24, 8, 92)),
                        hslToHex(baseHsl.h, clamp(baseHsl.s + 6, 12, 100), clamp(baseHsl.l - 18, 8, 92))
                    ];
            }

            return count === 2
                ? [
                    baseHex,
                    hslToHex(rotateHue(baseHsl.h, 22), clamp(baseHsl.s + 5, 12, 100), clamp(baseHsl.l - 8, 8, 92))
                ]
                : [
                    baseHex,
                    hslToHex(rotateHue(baseHsl.h, -24), clamp(baseHsl.s - 7, 12, 100), clamp(baseHsl.l + 12, 8, 92)),
                    hslToHex(rotateHue(baseHsl.h, 24), clamp(baseHsl.s + 5, 12, 100), clamp(baseHsl.l - 10, 8, 92))
                ];
        }

        function syncEditorFromActive() {
            const color = getColorAt(activeColorIndex) || DEFAULT_COLORS[activeColorIndex] || DEFAULT_COLORS[0];
            const rgb = hexToRgb(color);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            activeHsv = hexToHsv(color);

            activeHexInput.value = color;
            activeSwatch.style.background = color;
            hexMetric.textContent = color;
            rgbMetric.textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
            hslMetric.textContent = `${hsl.h}, ${hsl.s}, ${hsl.l}`;
            hueInput.value = Math.round(activeHsv.h);
            hueInput.style.color = `hsl(${activeHsv.h}, 100%, 50%)`;
            svArea.style.background = [
                "linear-gradient(to top, #000000, rgba(0, 0, 0, 0))",
                "linear-gradient(to right, #ffffff, rgba(255, 255, 255, 0))",
                `hsl(${activeHsv.h}, 100%, 50%)`
            ].join(", ");
            svHandle.style.left = `${activeHsv.s}%`;
            svHandle.style.top = `${100 - activeHsv.v}%`;
            svHandle.style.background = color;
            svArea.setAttribute("aria-valuenow", Math.round(activeHsv.s));
            updateToneStrip(hsl);
        }

        function updateToneStrip(hsl) {
            const chips = [];
            for (let index = 0; index < 9; index += 1) {
                const lightness = 92 - index * 10;
                chips.push(`<span class="tone-chip" style="background:${hslToHex(hsl.h, hsl.s, clamp(lightness, 8, 92))}"></span>`);
            }
            toneStrip.innerHTML = chips.join("");
        }

        function setSvFromPointer(event) {
            const rect = svArea.getBoundingClientRect();
            const x = clamp((event.clientX - rect.left) / rect.width, 0, 1);
            const y = clamp((event.clientY - rect.top) / rect.height, 0, 1);
            activeHsv.s = x * 100;
            activeHsv.v = (1 - y) * 100;
            commitActiveHsv();
        }

        function commitActiveHsv() {
            const color = hsvToHex(activeHsv.h, activeHsv.s, activeHsv.v);
            applyRowColor(activeColorIndex, color, { syncEditor: true });
            updateApp();
        }

        function collectColors() {
            const stopCount = MODE_STOPS[getMode()];
            const colors = [];

            for (let index = 0; index < stopCount; index += 1) {
                const value = normalizeHex(rows[index].text.value);
                if (!value) {
                    return null;
                }
                colors.push(value);
            }

            return colors;
        }

        function getMissingMessage(mode) {
            const required = MODE_STOPS[mode];
            return required === 1 ? "HEX 코드 1개 필요" : `HEX 코드 ${required}개 필요`;
        }

        function normalizeHex(value) {
            const raw = value.trim().replace(/^#/, "");
            if (/^[0-9a-fA-F]{3}$/.test(raw)) {
                return `#${raw.split("").map((char) => char + char).join("")}`.toUpperCase();
            }
            if (/^[0-9a-fA-F]{6}$/.test(raw)) {
                return `#${raw}`.toUpperCase();
            }
            return null;
        }

        function hexToRgb(hex) {
            const normalized = normalizeHex(hex);
            return {
                r: parseInt(normalized.slice(1, 3), 16),
                g: parseInt(normalized.slice(3, 5), 16),
                b: parseInt(normalized.slice(5, 7), 16)
            };
        }

        function rgbToHex(r, g, b) {
            return `#${[r, g, b].map((value) => {
                const hex = clamp(Math.round(value), 0, 255).toString(16);
                return hex.length === 1 ? `0${hex}` : hex;
            }).join("")}`.toUpperCase();
        }

        function rgbToHsl(r, g, b) {
            const red = r / 255;
            const green = g / 255;
            const blue = b / 255;
            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);
            let h = 0;
            let s = 0;
            const l = (max + min) / 2;

            if (max !== min) {
                const diff = max - min;
                s = l > 0.5 ? diff / (2 - max - min) : diff / (max + min);

                if (max === red) {
                    h = (green - blue) / diff + (green < blue ? 6 : 0);
                } else if (max === green) {
                    h = (blue - red) / diff + 2;
                } else {
                    h = (red - green) / diff + 4;
                }

                h /= 6;
            }

            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function hslToRgb(h, s, l) {
            const hue = rotateHue(h, 0) / 360;
            const saturation = clamp(s, 0, 100) / 100;
            const lightness = clamp(l, 0, 100) / 100;

            if (saturation === 0) {
                const value = lightness * 255;
                return { r: value, g: value, b: value };
            }

            const hueToRgb = (p, q, t) => {
                let localT = t;
                if (localT < 0) {
                    localT += 1;
                }
                if (localT > 1) {
                    localT -= 1;
                }
                if (localT < 1 / 6) {
                    return p + (q - p) * 6 * localT;
                }
                if (localT < 1 / 2) {
                    return q;
                }
                if (localT < 2 / 3) {
                    return p + (q - p) * (2 / 3 - localT) * 6;
                }
                return p;
            };

            const q = lightness < 0.5
                ? lightness * (1 + saturation)
                : lightness + saturation - lightness * saturation;
            const p = 2 * lightness - q;

            return {
                r: hueToRgb(p, q, hue + 1 / 3) * 255,
                g: hueToRgb(p, q, hue) * 255,
                b: hueToRgb(p, q, hue - 1 / 3) * 255
            };
        }

        function hslToHex(h, s, l) {
            const rgb = hslToRgb(h, s, l);
            return rgbToHex(rgb.r, rgb.g, rgb.b);
        }

        function rgbToHsv(r, g, b) {
            const red = r / 255;
            const green = g / 255;
            const blue = b / 255;
            const max = Math.max(red, green, blue);
            const min = Math.min(red, green, blue);
            const diff = max - min;
            let h = 0;

            if (diff !== 0) {
                if (max === red) {
                    h = 60 * (((green - blue) / diff) % 6);
                } else if (max === green) {
                    h = 60 * ((blue - red) / diff + 2);
                } else {
                    h = 60 * ((red - green) / diff + 4);
                }
            }

            return {
                h: rotateHue(h, 0),
                s: max === 0 ? 0 : (diff / max) * 100,
                v: max * 100
            };
        }

        function hsvToRgb(h, s, v) {
            const hue = rotateHue(h, 0);
            const saturation = clamp(s, 0, 100) / 100;
            const value = clamp(v, 0, 100) / 100;
            const chroma = value * saturation;
            const x = chroma * (1 - Math.abs((hue / 60) % 2 - 1));
            const m = value - chroma;
            let red = 0;
            let green = 0;
            let blue = 0;

            if (hue < 60) {
                red = chroma;
                green = x;
            } else if (hue < 120) {
                red = x;
                green = chroma;
            } else if (hue < 180) {
                green = chroma;
                blue = x;
            } else if (hue < 240) {
                green = x;
                blue = chroma;
            } else if (hue < 300) {
                red = x;
                blue = chroma;
            } else {
                red = chroma;
                blue = x;
            }

            return {
                r: (red + m) * 255,
                g: (green + m) * 255,
                b: (blue + m) * 255
            };
        }

        function hexToHsv(hex) {
            const rgb = hexToRgb(hex);
            return rgbToHsv(rgb.r, rgb.g, rgb.b);
        }

        function hsvToHex(h, s, v) {
            const rgb = hsvToRgb(h, s, v);
            return rgbToHex(rgb.r, rgb.g, rgb.b);
        }

        function rotateHue(hue, amount) {
            return ((hue + amount) % 360 + 360) % 360;
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function makeCssBackground(mode, colors, angle) {
            if (mode === "solid") {
                return colors[0];
            }
            return `linear-gradient(${angle}deg, ${colors.join(", ")})`;
        }

        function parseResolution(value) {
            return value.split("x").map((part) => Number(part));
        }

        function setStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = `status ${type || ""}`.trim();
        }

        async function downloadWallpaper() {
            const mode = getMode();
            const colors = collectColors();

            if (!colors) {
                updateApp();
                return;
            }

            downloadButton.disabled = true;
            downloadButton.textContent = "생성 중";
            setStatus("PNG 생성 중", "");

            try {
                const [width, height] = parseResolution(resolutionSelect.value);
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const context = canvas.getContext("2d");
                paintCanvas(context, width, height, mode, colors, Number(angleInput.value));

                const pngBlob = await canvasToBlob(canvas);
                const originalBytes = new Uint8Array(await pngBlob.arrayBuffer());
                const targetBytes = TARGET_BYTES[getSelectedSize()];
                const outputBytes = padPngToSize(originalBytes, targetBytes);
                const outputBlob = new Blob([outputBytes], { type: "image/png" });
                const filename = makeFilename(mode, colors, getSelectedSize(), width, height);

                triggerDownload(outputBlob, filename);

                const exact = outputBlob.size === targetBytes;
                const message = exact
                    ? `${formatBytes(outputBlob.size)} 저장`
                    : `${formatBytes(outputBlob.size)} 저장`;
                setStatus(message, exact ? "success" : "");
            } catch (error) {
                setStatus("다운로드 생성 실패", "error");
                console.error(error);
            } finally {
                downloadButton.disabled = false;
                downloadButton.textContent = "다운로드";
            }
        }

        function paintCanvas(context, width, height, mode, colors, angle) {
            if (mode === "solid") {
                context.fillStyle = colors[0];
            } else {
                const gradient = createCanvasGradient(context, width, height, angle);
                colors.forEach((color, index) => {
                    const stop = colors.length === 1 ? 0 : index / (colors.length - 1);
                    gradient.addColorStop(stop, color);
                });
                context.fillStyle = gradient;
            }

            context.fillRect(0, 0, width, height);
        }

        function createCanvasGradient(context, width, height, angle) {
            const radians = (angle - 90) * Math.PI / 180;
            const dx = Math.cos(radians);
            const dy = Math.sin(radians);
            const length = Math.abs(width * dx) + Math.abs(height * dy);
            const cx = width / 2;
            const cy = height / 2;

            return context.createLinearGradient(
                cx - dx * length / 2,
                cy - dy * length / 2,
                cx + dx * length / 2,
                cy + dy * length / 2
            );
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error("Canvas export failed"));
                    }
                }, "image/png");
            });
        }

        function padPngToSize(bytes, targetBytes) {
            const difference = targetBytes - bytes.length;
            if (difference < 12) {
                return bytes;
            }

            const iendOffset = findIendOffset(bytes);
            if (iendOffset === -1) {
                return bytes;
            }

            const dataLength = difference - 12;
            const chunk = new Uint8Array(dataLength + 12);
            writeUint32(chunk, 0, dataLength);
            chunk.set([0x6e, 0x70, 0x41, 0x64], 4);

            const crc = crc32(chunk.subarray(4, 8 + dataLength));
            writeUint32(chunk, 8 + dataLength, crc);

            const output = new Uint8Array(targetBytes);
            output.set(bytes.subarray(0, iendOffset), 0);
            output.set(chunk, iendOffset);
            output.set(bytes.subarray(iendOffset), iendOffset + chunk.length);
            return output;
        }

        function findIendOffset(bytes) {
            const pngSignature = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];

            for (let index = 0; index < pngSignature.length; index += 1) {
                if (bytes[index] !== pngSignature[index]) {
                    return -1;
                }
            }

            let offset = 8;
            while (offset + 12 <= bytes.length) {
                const length = readUint32(bytes, offset);
                const type = String.fromCharCode(
                    bytes[offset + 4],
                    bytes[offset + 5],
                    bytes[offset + 6],
                    bytes[offset + 7]
                );

                if (type === "IEND") {
                    return offset;
                }

                offset += length + 12;
            }

            return -1;
        }

        function readUint32(bytes, offset) {
            return (
                (bytes[offset] << 24) |
                (bytes[offset + 1] << 16) |
                (bytes[offset + 2] << 8) |
                bytes[offset + 3]
            ) >>> 0;
        }

        function writeUint32(bytes, offset, value) {
            bytes[offset] = (value >>> 24) & 0xff;
            bytes[offset + 1] = (value >>> 16) & 0xff;
            bytes[offset + 2] = (value >>> 8) & 0xff;
            bytes[offset + 3] = value & 0xff;
        }

        const CRC_TABLE = makeCrcTable();

        function makeCrcTable() {
            const table = new Uint32Array(256);
            for (let index = 0; index < 256; index += 1) {
                let value = index;
                for (let bit = 0; bit < 8; bit += 1) {
                    value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
                }
                table[index] = value >>> 0;
            }
            return table;
        }

        function crc32(bytes) {
            let crc = 0xffffffff;
            for (let index = 0; index < bytes.length; index += 1) {
                crc = CRC_TABLE[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
        }

        function makeFilename(mode, colors, sizeMb, width, height) {
            const colorName = colors.map((color) => color.replace("#", "").toLowerCase()).join("-");
            const modeName = mode === "solid" ? "solid" : "gradient";
            return `hex-wallpaper-${modeName}-${colorName}-${width}x${height}-${sizeMb}mb.png`;
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = filename;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function formatBytes(bytes) {
            return `${(bytes / 1000000).toFixed(2)} MB`;
        }
    </script>
</body>
