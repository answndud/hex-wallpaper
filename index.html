<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Wallpaper</title>
    <meta name="description" content="HEX 색상 코드로 단색 또는 그라데이션 PNG 배경화면을 생성합니다.">
    <style>
        :root {
            --bg: #101214;
            --panel: #181d21;
            --panel-strong: #20272c;
            --text: #edf2f4;
            --muted: #9aa7ad;
            --line: #303940;
            --accent: #29a37a;
            --accent-strong: #38c090;
            --warning: #f6c453;
            --error: #ff6b6b;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
            --preview-bg: #15191d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            border: 0;
        }

        .app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 392px;
            min-height: 100vh;
        }

        .preview-panel {
            min-width: 0;
            padding: 24px;
        }

        .preview-surface {
            position: sticky;
            top: 24px;
            min-height: calc(100vh - 48px);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            background:
                linear-gradient(45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.04) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.04) 75%),
                var(--preview-bg);
            background-position: 0 0, 0 12px, 12px -12px, -12px 0;
            background-size: 24px 24px;
            box-shadow: var(--shadow);
            transition: background 180ms ease;
        }

        .preview-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            width: fit-content;
            max-width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(10, 12, 14, 0.58);
            backdrop-filter: blur(14px);
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: conic-gradient(from 180deg, #29a37a, #f6c453, #6ea8fe, #29a37a);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
            flex: 0 0 auto;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: 22px;
            line-height: 1.1;
            font-weight: 760;
            letter-spacing: 0;
        }

        .preview-label {
            margin-top: 4px;
            color: rgba(237, 242, 244, 0.74);
            font-size: 13px;
            line-height: 1.4;
        }

        .preview-spec {
            align-self: flex-end;
            max-width: 100%;
            padding: 9px 11px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(10, 12, 14, 0.58);
            color: rgba(237, 242, 244, 0.82);
            font-size: 13px;
            line-height: 1.3;
            backdrop-filter: blur(14px);
        }

        .controls {
            min-height: 100vh;
            border-left: 1px solid var(--line);
            background: var(--panel);
            padding: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        h2 {
            font-size: 20px;
            line-height: 1.2;
            font-weight: 720;
            letter-spacing: 0;
        }

        fieldset {
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
        }

        legend,
        label.label {
            display: block;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
            line-height: 1.3;
        }

        .segmented {
            display: grid;
            gap: 8px;
        }

        .segmented.columns-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .segmented.columns-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .segmented input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .segment {
            display: grid;
            place-items: center;
            min-height: 42px;
            padding: 9px 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel-strong);
            color: var(--text);
            font-size: 14px;
            font-weight: 680;
            line-height: 1.1;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
        }

        .segmented input:focus-visible + .segment,
        .field-input:focus-visible,
        .select-wrap select:focus-visible,
        .ghost-button:focus-visible,
        .download-button:focus-visible {
            outline: 2px solid var(--warning);
            outline-offset: 2px;
        }

        .segmented input:checked + .segment {
            border-color: rgba(41, 163, 122, 0.78);
            background: rgba(41, 163, 122, 0.16);
            color: #c9f9e7;
        }

        .color-stack {
            display: grid;
            gap: 10px;
        }

        .color-row {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }

        .color-row[hidden],
        .gradient-controls[hidden] {
            display: none;
        }

        .color-picker {
            width: 44px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0;
            background: transparent;
            cursor: pointer;
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker::-webkit-color-swatch {
            border: 0;
            border-radius: 7px;
        }

        .color-picker::-moz-color-swatch {
            border: 0;
            border-radius: 7px;
        }

        .field-input,
        .select-wrap select {
            width: 100%;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #121619;
            color: var(--text);
        }

        .field-input {
            padding: 0 12px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 15px;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .field-input::placeholder {
            color: #647178;
        }

        .color-row.invalid .field-input {
            border-color: rgba(255, 107, 107, 0.74);
        }

        .range-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 58px;
            gap: 12px;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .angle-value {
            min-height: 32px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #121619;
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap select {
            appearance: none;
            padding: 0 40px 0 12px;
            cursor: pointer;
        }

        .select-wrap::after {
            content: "";
            position: absolute;
            right: 14px;
            top: 50%;
            width: 8px;
            height: 8px;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: translateY(-65%) rotate(45deg);
            pointer-events: none;
        }

        .actions {
            display: grid;
            gap: 10px;
        }

        .ghost-button,
        .download-button {
            min-height: 44px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
        }

        .ghost-button {
            padding: 0 12px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .ghost-button:hover {
            color: var(--text);
            border-color: #48545c;
        }

        .download-button {
            width: 100%;
            background: var(--accent);
            color: #07110d;
            font-size: 15px;
            font-weight: 800;
        }

        .download-button:hover:not(:disabled) {
            transform: translateY(-1px);
            background: var(--accent-strong);
        }

        .download-button:disabled {
            cursor: not-allowed;
            opacity: 0.54;
        }

        .status {
            min-height: 38px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #121619;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.35;
        }

        .status.error {
            border-color: rgba(255, 107, 107, 0.6);
            color: #ffb3b3;
        }

        .status.success {
            border-color: rgba(41, 163, 122, 0.62);
            color: #bdf4dd;
        }

        @media (max-width: 880px) {
            .app {
                grid-template-columns: 1fr;
            }

            .preview-panel {
                padding: 14px;
            }

            .preview-surface {
                position: relative;
                top: auto;
                min-height: 54vh;
            }

            .controls {
                min-height: auto;
                border-left: 0;
                border-top: 1px solid var(--line);
                padding: 18px 14px 24px;
            }
        }

        @media (max-width: 520px) {
            .preview-overlay {
                padding: 14px;
            }

            .brand {
                width: 100%;
            }

            .preview-spec {
                align-self: stretch;
                text-align: center;
            }

            .segmented.columns-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="preview-panel" aria-label="배경화면 미리보기">
            <div class="preview-surface" id="previewSurface">
                <div class="preview-overlay">
                    <div class="brand">
                        <span class="brand-mark" aria-hidden="true"></span>
                        <div>
                            <h1>Hex Wallpaper</h1>
                            <p class="preview-label" id="previewLabel">HEX 입력 대기</p>
                        </div>
                    </div>
                    <p class="preview-spec" id="previewSpec">1920 x 1080 · 1 MB · PNG</p>
                </div>
            </div>
        </section>

        <aside class="controls" aria-label="배경화면 설정">
            <form id="wallpaperForm" autocomplete="off">
                <div class="section-head">
                    <h2>설정</h2>
                    <button class="ghost-button" type="reset">초기화</button>
                </div>

                <fieldset>
                    <legend>모드</legend>
                    <div class="segmented columns-3">
                        <label>
                            <input type="radio" name="mode" value="solid" checked>
                            <span class="segment">단색</span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="gradient2">
                            <span class="segment">2색</span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="gradient3">
                            <span class="segment">3색</span>
                        </label>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>색상</legend>
                    <div class="color-stack">
                        <div class="color-row" data-color-row="0">
                            <input class="color-picker" type="color" value="#2A9D8F" aria-label="첫 번째 색상 선택">
                            <input class="field-input" type="text" inputmode="text" maxlength="7" placeholder="#2A9D8F" aria-label="첫 번째 HEX 코드">
                        </div>
                        <div class="color-row" data-color-row="1" hidden>
                            <input class="color-picker" type="color" value="#F6C453" aria-label="두 번째 색상 선택">
                            <input class="field-input" type="text" inputmode="text" maxlength="7" placeholder="#F6C453" aria-label="두 번째 HEX 코드">
                        </div>
                        <div class="color-row" data-color-row="2" hidden>
                            <input class="color-picker" type="color" value="#6EA8FE" aria-label="세 번째 색상 선택">
                            <input class="field-input" type="text" inputmode="text" maxlength="7" placeholder="#6EA8FE" aria-label="세 번째 HEX 코드">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="gradient-controls" id="gradientControls" hidden>
                    <legend>각도</legend>
                    <div class="range-row">
                        <input id="angleInput" type="range" min="0" max="360" step="15" value="135" aria-label="그라데이션 각도">
                        <output class="angle-value" id="angleValue" for="angleInput">135°</output>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>파일 크기</legend>
                    <div class="segmented columns-3">
                        <label>
                            <input type="radio" name="fileSize" value="1" checked>
                            <span class="segment">1 MB</span>
                        </label>
                        <label>
                            <input type="radio" name="fileSize" value="2">
                            <span class="segment">2 MB</span>
                        </label>
                        <label>
                            <input type="radio" name="fileSize" value="3">
                            <span class="segment">3 MB</span>
                        </label>
                    </div>
                </fieldset>

                <fieldset>
                    <label class="label" for="resolutionSelect">해상도</label>
                    <div class="select-wrap">
                        <select id="resolutionSelect">
                            <option value="1920x1080" selected>1920 x 1080</option>
                            <option value="2560x1440">2560 x 1440</option>
                            <option value="3840x2160">3840 x 2160</option>
                            <option value="1080x1920">1080 x 1920</option>
                            <option value="1600x1600">1600 x 1600</option>
                        </select>
                    </div>
                </fieldset>

                <div class="actions">
                    <button class="download-button" id="downloadButton" type="submit" disabled>다운로드</button>
                    <p class="status" id="status" aria-live="polite">HEX 입력 대기</p>
                </div>
            </form>
        </aside>
    </main>

    <script>
        const TARGET_BYTES = {
            1: 1000000,
            2: 2000000,
            3: 3000000
        };

        const MODE_STOPS = {
            solid: 1,
            gradient2: 2,
            gradient3: 3
        };

        const form = document.getElementById("wallpaperForm");
        const previewSurface = document.getElementById("previewSurface");
        const previewLabel = document.getElementById("previewLabel");
        const previewSpec = document.getElementById("previewSpec");
        const gradientControls = document.getElementById("gradientControls");
        const angleInput = document.getElementById("angleInput");
        const angleValue = document.getElementById("angleValue");
        const resolutionSelect = document.getElementById("resolutionSelect");
        const downloadButton = document.getElementById("downloadButton");
        const statusEl = document.getElementById("status");
        const rows = Array.from(document.querySelectorAll("[data-color-row]")).map((row) => ({
            row,
            picker: row.querySelector(".color-picker"),
            text: row.querySelector(".field-input")
        }));

        rows.forEach(({ row, picker, text }) => {
            picker.addEventListener("input", () => {
                text.value = picker.value.toUpperCase();
                row.classList.remove("invalid");
                updateApp();
            });

            text.addEventListener("input", () => {
                const normalized = normalizeHex(text.value);
                row.classList.toggle("invalid", text.value.trim().length > 0 && !normalized);
                if (normalized) {
                    picker.value = normalized;
                }
                updateApp();
            });

            text.addEventListener("blur", () => {
                const normalized = normalizeHex(text.value);
                if (normalized) {
                    text.value = normalized;
                    picker.value = normalized;
                }
                updateApp();
            });
        });

        form.addEventListener("change", updateApp);
        form.addEventListener("reset", () => {
            window.setTimeout(() => {
                rows.forEach(({ row }) => row.classList.remove("invalid"));
                updateApp();
            }, 0);
        });

        angleInput.addEventListener("input", updateApp);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            await downloadWallpaper();
        });

        updateApp();

        function updateApp() {
            const mode = getMode();
            const stopCount = MODE_STOPS[mode];
            const colors = collectColors();
            const sizeMb = getSelectedSize();
            const [width, height] = parseResolution(resolutionSelect.value);
            const angle = Number(angleInput.value);

            rows.forEach(({ row }, index) => {
                row.hidden = index >= stopCount;
            });

            gradientControls.hidden = mode === "solid";
            angleValue.value = `${angle}°`;
            angleValue.textContent = `${angle}°`;
            previewSpec.textContent = `${width} x ${height} · ${sizeMb} MB · PNG`;

            if (colors) {
                const background = makeCssBackground(mode, colors, angle);
                previewSurface.style.background = background;
                previewLabel.textContent = colors.join(" · ");
                setStatus("다운로드 준비 완료", "success");
                downloadButton.disabled = false;
            } else {
                previewSurface.style.background = "";
                previewLabel.textContent = "HEX 입력 대기";
                setStatus(getMissingMessage(mode), "error");
                downloadButton.disabled = true;
            }
        }

        function getMode() {
            return form.elements.mode.value;
        }

        function getSelectedSize() {
            return Number(form.elements.fileSize.value);
        }

        function collectColors() {
            const stopCount = MODE_STOPS[getMode()];
            const colors = [];

            for (let index = 0; index < stopCount; index += 1) {
                const value = normalizeHex(rows[index].text.value);
                if (!value) {
                    return null;
                }
                colors.push(value);
            }

            return colors;
        }

        function getMissingMessage(mode) {
            const required = MODE_STOPS[mode];
            return required === 1 ? "HEX 코드 1개 필요" : `HEX 코드 ${required}개 필요`;
        }

        function normalizeHex(value) {
            const raw = value.trim().replace(/^#/, "");
            if (/^[0-9a-fA-F]{3}$/.test(raw)) {
                return `#${raw.split("").map((char) => char + char).join("")}`.toUpperCase();
            }
            if (/^[0-9a-fA-F]{6}$/.test(raw)) {
                return `#${raw}`.toUpperCase();
            }
            return null;
        }

        function makeCssBackground(mode, colors, angle) {
            if (mode === "solid") {
                return colors[0];
            }
            return `linear-gradient(${angle}deg, ${colors.join(", ")})`;
        }

        function parseResolution(value) {
            return value.split("x").map((part) => Number(part));
        }

        function setStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = `status ${type || ""}`.trim();
        }

        async function downloadWallpaper() {
            const mode = getMode();
            const colors = collectColors();

            if (!colors) {
                updateApp();
                return;
            }

            downloadButton.disabled = true;
            downloadButton.textContent = "생성 중";
            setStatus("PNG 생성 중", "");

            try {
                const [width, height] = parseResolution(resolutionSelect.value);
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const context = canvas.getContext("2d");
                paintCanvas(context, width, height, mode, colors, Number(angleInput.value));

                const pngBlob = await canvasToBlob(canvas);
                const originalBytes = new Uint8Array(await pngBlob.arrayBuffer());
                const targetBytes = TARGET_BYTES[getSelectedSize()];
                const outputBytes = padPngToSize(originalBytes, targetBytes);
                const outputBlob = new Blob([outputBytes], { type: "image/png" });
                const filename = makeFilename(mode, colors, getSelectedSize(), width, height);

                triggerDownload(outputBlob, filename);

                const exact = outputBlob.size === targetBytes;
                const message = exact
                    ? `${formatBytes(outputBlob.size)} 저장`
                    : `${formatBytes(outputBlob.size)} 저장`;
                setStatus(message, exact ? "success" : "");
            } catch (error) {
                setStatus("다운로드 생성 실패", "error");
                console.error(error);
            } finally {
                downloadButton.disabled = false;
                downloadButton.textContent = "다운로드";
            }
        }

        function paintCanvas(context, width, height, mode, colors, angle) {
            if (mode === "solid") {
                context.fillStyle = colors[0];
            } else {
                const gradient = createCanvasGradient(context, width, height, angle);
                colors.forEach((color, index) => {
                    const stop = colors.length === 1 ? 0 : index / (colors.length - 1);
                    gradient.addColorStop(stop, color);
                });
                context.fillStyle = gradient;
            }

            context.fillRect(0, 0, width, height);
        }

        function createCanvasGradient(context, width, height, angle) {
            const radians = (angle - 90) * Math.PI / 180;
            const dx = Math.cos(radians);
            const dy = Math.sin(radians);
            const length = Math.abs(width * dx) + Math.abs(height * dy);
            const cx = width / 2;
            const cy = height / 2;

            return context.createLinearGradient(
                cx - dx * length / 2,
                cy - dy * length / 2,
                cx + dx * length / 2,
                cy + dy * length / 2
            );
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error("Canvas export failed"));
                    }
                }, "image/png");
            });
        }

        function padPngToSize(bytes, targetBytes) {
            const difference = targetBytes - bytes.length;
            if (difference < 12) {
                return bytes;
            }

            const iendOffset = findIendOffset(bytes);
            if (iendOffset === -1) {
                return bytes;
            }

            const dataLength = difference - 12;
            const chunk = new Uint8Array(dataLength + 12);
            writeUint32(chunk, 0, dataLength);
            chunk.set([0x6e, 0x70, 0x41, 0x64], 4);

            const crc = crc32(chunk.subarray(4, 8 + dataLength));
            writeUint32(chunk, 8 + dataLength, crc);

            const output = new Uint8Array(targetBytes);
            output.set(bytes.subarray(0, iendOffset), 0);
            output.set(chunk, iendOffset);
            output.set(bytes.subarray(iendOffset), iendOffset + chunk.length);
            return output;
        }

        function findIendOffset(bytes) {
            const pngSignature = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];

            for (let index = 0; index < pngSignature.length; index += 1) {
                if (bytes[index] !== pngSignature[index]) {
                    return -1;
                }
            }

            let offset = 8;
            while (offset + 12 <= bytes.length) {
                const length = readUint32(bytes, offset);
                const type = String.fromCharCode(
                    bytes[offset + 4],
                    bytes[offset + 5],
                    bytes[offset + 6],
                    bytes[offset + 7]
                );

                if (type === "IEND") {
                    return offset;
                }

                offset += length + 12;
            }

            return -1;
        }

        function readUint32(bytes, offset) {
            return (
                (bytes[offset] << 24) |
                (bytes[offset + 1] << 16) |
                (bytes[offset + 2] << 8) |
                bytes[offset + 3]
            ) >>> 0;
        }

        function writeUint32(bytes, offset, value) {
            bytes[offset] = (value >>> 24) & 0xff;
            bytes[offset + 1] = (value >>> 16) & 0xff;
            bytes[offset + 2] = (value >>> 8) & 0xff;
            bytes[offset + 3] = value & 0xff;
        }

        const CRC_TABLE = makeCrcTable();

        function makeCrcTable() {
            const table = new Uint32Array(256);
            for (let index = 0; index < 256; index += 1) {
                let value = index;
                for (let bit = 0; bit < 8; bit += 1) {
                    value = (value & 1) ? (0xedb88320 ^ (value >>> 1)) : (value >>> 1);
                }
                table[index] = value >>> 0;
            }
            return table;
        }

        function crc32(bytes) {
            let crc = 0xffffffff;
            for (let index = 0; index < bytes.length; index += 1) {
                crc = CRC_TABLE[(crc ^ bytes[index]) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
        }

        function makeFilename(mode, colors, sizeMb, width, height) {
            const colorName = colors.map((color) => color.replace("#", "").toLowerCase()).join("-");
            const modeName = mode === "solid" ? "solid" : "gradient";
            return `hex-wallpaper-${modeName}-${colorName}-${width}x${height}-${sizeMb}mb.png`;
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = filename;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function formatBytes(bytes) {
            return `${(bytes / 1000000).toFixed(2)} MB`;
        }
    </script>
</body>
